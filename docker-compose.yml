version: '3.8'

services:
  db:
    image: postgres:14-alpine
    container_name: dfi_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: dfi_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dfi_api_backend
    restart: always
    ports:
      - "8080:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/dfi_db
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - MODEL_PATH=/app/models
    volumes:
      - ./models:/app/models
      - ./datasets:/app/datasets
    depends_on:
      - db

volumes:
  pgdata:
